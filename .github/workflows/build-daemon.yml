name: build-daemon

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: kimi-pet-daemon-macos-arm64
          - os: macos-13
            asset: kimi-pet-daemon-macos-x64
          - os: ubuntu-latest
            asset: kimi-pet-daemon-linux-x64
          - os: windows-latest
            asset: kimi-pet-daemon-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install --upgrade pip pyinstaller -r daemon/requirements.txt

      - name: Build onefile daemon
        run: pyinstaller daemon/kimi-pet-daemon.spec --noconfirm

      - name: Install Qt runtime deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      - name: Smoke test (non-Windows)
        if: runner.os != 'Windows'
        run: |
          set -e
          QT_QPA_PLATFORM=offscreen ./dist/kimi-pet-daemon &
          PID=$!
          sleep 8
          # alive and well if we can still signal it; a frozen-binary startup
          # crash would have exited long ago and fail this step
          kill -0 $PID
          kill $PID
          wait $PID || true

      - name: Upload release asset
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          # Check the .exe name first: Git Bash's test -f silently matches
          # name.exe, but the gh CLI (a native binary) does not.
          if [ -f dist/kimi-pet-daemon.exe ]; then
            BIN=dist/kimi-pet-daemon.exe
          else
            BIN=dist/kimi-pet-daemon
          fi
          # Rename on disk so the uploaded asset gets the platform-specific
          # name exactly (no gh rename syntax, no clobbering across jobs).
          mv "$BIN" "dist/$ASSET"
          gh release upload "$TAG" "dist/$ASSET" --clobber
